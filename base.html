<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureUPI — {% block title %}{% endblock %}</title>
<style>
  :root {
    --primary: #1565C0;
    --primary-light: #1976D2;
    --accent: #00BCD4;
    --success: #00C853;
    --danger: #FF1744;
    --warning: #FF9800;
    --bg: #F0F4FF;
    --card: #FFFFFF;
    --text: #1A237E;
    --muted: #546E7A;
    --border: #BBDEFB;
    --shadow: 0 4px 20px rgba(21,101,192,0.12);
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* NAV */
  nav {
    background: linear-gradient(135deg, var(--primary) 0%, #0D47A1 100%);
    padding: 0 32px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 15px rgba(21,101,192,0.4);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-brand {
    font-size: 1.4rem; font-weight: 800; color: white;
    padding: 16px 0; margin-right: 24px; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 10px;
  }
  .nav-brand .shield { font-size: 1.6rem; }
  nav a {
    color: rgba(255,255,255,0.85); text-decoration: none;
    padding: 18px 16px; font-size: 0.92rem; font-weight: 500;
    border-bottom: 3px solid transparent; transition: all 0.2s;
  }
  nav a:hover, nav a.active {
    color: white; border-bottom-color: var(--accent);
    background: rgba(255,255,255,0.08);
  }

  /* LAYOUT */
  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
  .page-header {
    background: linear-gradient(135deg, var(--primary) 0%, #283593 100%);
    color: white; padding: 36px 32px; border-radius: var(--radius);
    margin-bottom: 28px; box-shadow: var(--shadow);
  }
  .page-header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
  .page-header p  { opacity: 0.85; font-size: 1rem; }

  /* CARDS */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 24px; margin-bottom: 24px;
    border: 1px solid var(--border);
  }
  .card-title {
    font-size: 1.05rem; font-weight: 700; color: var(--primary);
    margin-bottom: 18px; padding-bottom: 10px;
    border-bottom: 2px solid var(--bg); display: flex; align-items: center; gap: 8px;
  }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
  input, select {
    width: 100%; padding: 11px 14px; border: 2px solid var(--border);
    border-radius: 8px; font-size: 0.95rem; color: var(--text);
    background: #FAFCFF; transition: border 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }

  /* BUTTONS */
  .btn {
    padding: 12px 28px; border: none; border-radius: 8px; font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex;
    align-items: center; gap: 8px;
  }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; box-shadow: 0 4px 12px rgba(21,101,192,0.3); }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(21,101,192,0.4); }
  .btn-lg { padding: 14px 36px; font-size: 1.05rem; width: 100%; justify-content: center; margin-top: 8px; }

  /* BADGES */
  .badge {
    display: inline-flex; align-items: center; padding: 3px 10px;
    border-radius: 20px; font-size: 0.78rem; font-weight: 600; gap: 4px;
  }
  .badge-success  { background: #E8F5E9; color: #2E7D32; }
  .badge-danger   { background: #FFEBEE; color: #C62828; }
  .badge-warning  { background: #FFF3E0; color: #E65100; }
  .badge-info     { background: #E3F2FD; color: #1565C0; }
  .badge-good     { background: #E8F5E9; color: #2E7D32; }
  .badge-over     { background: #FFEBEE; color: #C62828; }
  .badge-under    { background: #FFF3E0; color: #E65100; }

  /* TABLE */
  table { width: 100%; border-collapse: collapse; }
  th {
    background: linear-gradient(135deg, var(--primary), #283593);
    color: white; padding: 12px 14px; font-size: 0.85rem;
    font-weight: 600; text-align: left; letter-spacing: 0.3px;
  }
  th:first-child { border-radius: 8px 0 0 0; }
  th:last-child  { border-radius: 0 8px 0 0; }
  td { padding: 11px 14px; font-size: 0.88rem; border-bottom: 1px solid #EEF2FF; }
  tr:hover td    { background: #F5F7FF; }
  tr:last-child td { border-bottom: none; }

  /* METRIC CARDS */
  .metric-card {
    background: var(--card); border-radius: 12px; padding: 20px 18px;
    border: 1px solid var(--border); text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .metric-value { font-size: 1.9rem; font-weight: 800; line-height: 1.1; }
  .metric-label { font-size: 0.8rem; color: var(--muted); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

  /* RESULT BOX */
  .result-box {
    border-radius: var(--radius); padding: 28px 24px; text-align: center;
    animation: fadeIn 0.4s ease; margin-top: 16px;
  }
  .result-fraud { background: linear-gradient(135deg, #FF1744, #D50000); color: white; }
  .result-legit { background: linear-gradient(135deg, #00C853, #1B5E20); color: white; }
  .result-icon { font-size: 3rem; margin-bottom: 10px; }
  .result-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
  .result-sub   { font-size: 0.95rem; opacity: 0.9; }

  /* PROB BAR */
  .prob-bar { background: rgba(255,255,255,0.2); border-radius: 20px; height: 12px; margin-top: 16px; overflow: hidden; }
  .prob-fill { height: 100%; border-radius: 20px; background: rgba(255,255,255,0.85); transition: width 0.8s ease; }

  /* PLOTS */
  .plot-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .plot-card { background: white; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .plot-title { font-weight: 600; padding: 12px 16px; background: var(--bg); font-size: 0.9rem; color: var(--primary); }
  .plot-card img { width: 100%; display: block; }

  /* LOADING */
  #loadingSpinner { display:none; text-align:center; padding: 30px; }
  .spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  /* HERO BANNER */
  .hero {
    background: linear-gradient(135deg, #0D47A1 0%, #1565C0 40%, #0097A7 100%);
    color: white; padding: 48px 40px; border-radius: var(--radius);
    margin-bottom: 28px; box-shadow: 0 8px 32px rgba(13,71,161,0.35);
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: '🛡️'; position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
    font-size: 7rem; opacity: 0.12;
  }
  .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
  .hero p  { font-size: 1.05rem; opacity: 0.9; max-width: 520px; line-height: 1.6; }
  .hero-stats { display: flex; gap: 32px; margin-top: 24px; flex-wrap: wrap; }
  .hero-stat { background: rgba(255,255,255,0.12); border-radius: 10px; padding: 14px 20px; }
  .hero-stat-val { font-size: 1.5rem; font-weight: 800; }
  .hero-stat-lbl { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

  @media(max-width:768px) {
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    nav a { padding: 12px 10px; font-size: 0.82rem; }
  }
</style>
</head>
<body>
<nav>
  <div class="nav-brand"><span class="shield">🛡️</span> SecureUPI</div>
  <a href="/"           class="{% if request.endpoint=='index' %}active{% endif %}">🏠 Home</a>
  <a href="/eda"        class="{% if request.endpoint=='eda' %}active{% endif %}">📊 EDA</a>
  <a href="/preprocessing" class="{% if request.endpoint=='preprocessing' %}active{% endif %}">⚙️ Preprocessing</a>
  <a href="/models"     class="{% if request.endpoint=='models_page' %}active{% endif %}">🤖 Models</a>
  <a href="/comparison" class="{% if request.endpoint=='comparison' %}active{% endif %}">📈 Comparison</a>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
